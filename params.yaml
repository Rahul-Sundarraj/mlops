simulate:
  start: "2024-01-01"
  end: "2025-12-31"
  seed: 42
split:
  test_start: "2025-10-01"   # time-based split; test window covers NE monsoon + festivals
train:
  mlflow_uri: "sqlite:///mlflow.db"
  experiment: "railway-delay"
  registered_model: "delay-predictor"
  xgboost: {n_estimators: 400, max_depth: 6, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.8}
  lightgbm: {n_estimators: 400, num_leaves: 31, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.8}
