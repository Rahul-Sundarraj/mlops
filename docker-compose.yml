# Two images: `web` (light Flask app) and `ml` (training, MLflow, demo). Named volumes share data and the exported model.
#   docker compose up --build                  -> trains + exports the model, then web on :8000 (passenger page at /, monitor at /ops)
#   docker compose --profile demo up demo      -> replay the incident demo; open :8000/ops to see it
x-ml: &ml
  build: {context: ., dockerfile: Dockerfile.pipeline}
  volumes:
    - data:/app/data
    - db:/app/db
    - mlruns:/app/mlruns
    - models:/app/models

services:
  pipeline:
    <<: *ml
    command: sh -c "mkdir -p /app/db && python -m src.data.simulate && python -m src.features.build && python -m src.models.train"
    restart: "no"

  web:
    build: .
    ports: ["8000:8000"]
    volumes:
      - data:/app/data
      - models:/app/models
    depends_on:
      pipeline: {condition: service_completed_successfully}

  mlflow:
    <<: *ml
    command: mlflow server --backend-store-uri sqlite:////app/db/mlflow.db --host 0.0.0.0 --port 5000
    ports: ["5000:5000"]
    depends_on:
      pipeline: {condition: service_completed_successfully}

  demo:
    <<: *ml
    profiles: [demo]
    command: python -m src.demo.run_demo --scenario all
    depends_on:
      pipeline: {condition: service_completed_successfully}

volumes:
  data:
  db:
  mlruns:
  models:
